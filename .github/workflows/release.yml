name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Build
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o hyprspacefix

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: hyprspacefix
          generate_release_notes: true
